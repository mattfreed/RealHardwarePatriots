<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Hardware Patriots</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            background: #000;
        }

        .background-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(11, 35, 91, 0.4) 0%, rgba(139, 0, 0, 0.3) 100%);
            z-index: 1;
        }

        .event-date {
            position: fixed;
            /* Match the gap above the glass as the 16:9 video scales to cover. */
            top: calc(50% - max(15vh, 8.4375vw));
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 3;
            color: #f4f2ec;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            font-size: clamp(18px, 2vw, 28px);
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            line-height: 1;
            letter-spacing: 0.12em;
            white-space: nowrap;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.65);
            pointer-events: none;
        }

        .container {
            position: fixed;
            bottom: max(7vh, calc(env(safe-area-inset-bottom) + 24px));
            left: 0;
            right: 0;
            z-index: 3;
            text-align: center;
            pointer-events: none;
        }

        h1 {
            font-size: 5rem;
            color: #ffffff;
            margin-bottom: 50px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 8px;
            text-shadow: 
                3px 3px 10px rgba(0, 0, 0, 0.8),
                -1px -1px 2px rgba(255, 255, 255, 0.3);
            line-height: 1.2;
        }

        .flag-container {
            width: 240px;
            margin: 0 auto 40px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .flag-image {
            display: block;
            width: 100%;
            height: auto;
        }

        .signup-link {
            position: relative;
            display: inline-block;
            width: clamp(176px, 22vw, 208px);
            aspect-ratio: 1;
            pointer-events: auto;
            cursor: pointer;
            border: 2px solid #a57808;
            border-top-color: #ffe994;
            border-radius: 14px;
            background:
                radial-gradient(circle at 12px 12px, #64635c 0 2px, #d9d5bb 2.5px 4px, #8e761a 4.5px 5px, transparent 5.5px),
                radial-gradient(circle at calc(100% - 12px) 12px, #64635c 0 2px, #d9d5bb 2.5px 4px, #8e761a 4.5px 5px, transparent 5.5px),
                radial-gradient(circle at 12px calc(100% - 12px), #64635c 0 2px, #d9d5bb 2.5px 4px, #8e761a 4.5px 5px, transparent 5.5px),
                radial-gradient(circle at calc(100% - 12px) calc(100% - 12px), #64635c 0 2px, #d9d5bb 2.5px 4px, #8e761a 4.5px 5px, transparent 5.5px),
                linear-gradient(145deg, #ffdd4c, #f3be08 65%, #dca306);
            color: #fff7e9;
            text-decoration: none;
            box-shadow: inset 0 1px 1px #fff1a3, 0 5px 0 #896109, 0 14px 28px rgba(0, 0, 0, 0.5);
            -webkit-tap-highlight-color: transparent;
        }

        /* The collar stays fixed while the red mushroom cap depresses. */
        .signup-link::before {
            content: '';
            position: absolute;
            inset: 17px;
            border-radius: 50%;
            background: repeating-conic-gradient(#262829 0deg 5deg, #414344 5deg 8deg);
            border: 3px solid #202122;
            box-shadow: inset 0 2px 2px #6b6b60, 0 3px 3px rgba(74, 46, 0, 0.6);
        }

        .button-face {
            position: absolute;
            inset: 24px;
            display: block;
            width: calc(100% - 48px);
            height: calc(100% - 48px);
            border: 3px solid #a2171b;
            border-top-color: #f76b5b;
            border-radius: 50%;
            background: radial-gradient(ellipse at 38% 22%, #f85b47, #e73228 40%, #ca1b20 75%, #a41119);
            box-shadow: inset 0 3px 3px rgba(255, 211, 184, 0.45), inset 0 -5px 8px rgba(104, 0, 9, 0.4), 0 8px 0 #810b13, 0 11px 6px rgba(0, 0, 0, 0.5);
            transform: translateY(-5px);
            transition: transform 140ms ease, box-shadow 140ms ease;
        }

        .button-ring {
            fill: none;
            stroke: #ffab90;
            stroke-opacity: 0.4;
            stroke-width: 1.5;
        }

        .button-label {
            fill: currentColor;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 25px;
            font-weight: 800;
            letter-spacing: 0.8px;
        }

        @media (hover: hover) {
            .signup-link:hover .button-face {
                transform: translateY(-7px);
                box-shadow: inset 0 3px 3px rgba(255, 211, 184, 0.5), inset 0 -5px 8px rgba(104, 0, 9, 0.4), 0 10px 0 #810b13, 0 14px 8px rgba(0, 0, 0, 0.5);
            }
        }

        .signup-link:focus-visible {
            outline: 3px solid #fff7e9;
            outline-offset: 7px;
        }

        .signup-link:active .button-face {
            transform: translateY(2px);
            box-shadow: inset 0 2px 5px rgba(104, 0, 9, 0.25), 0 1px 0 #810b13, 0 3px 3px rgba(0, 0, 0, 0.4);
        }

        @media (prefers-reduced-motion: reduce) {
            .button-face { transition: none; }
        }

        @media (max-height: 500px) {
            .container { bottom: max(20px, env(safe-area-inset-bottom)); }
            .signup-link { width: 148px; }
            .signup-link::before { inset: 12px; }
            .button-face { inset: 18px; width: calc(100% - 36px); height: calc(100% - 36px); }
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 3rem;
                letter-spacing: 4px;
            }

            .flag-container {
                width: 180px;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 2rem;
                letter-spacing: 2px;
            }

            .flag-container {
                width: 150px;
            }
        }
    </style>
</head>
